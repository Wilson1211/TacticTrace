name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # check PRs
  pull_request:
    branches:
      - main

  # check pushes
  push:
    branches:
      - main
    tags:
      - 'ocaml-*/v*'

permissions:
  contents: read

jobs:
  # The blocking checks. The HOL Light revision they build against is pinned in
  # build-and-test.yml. TacticTrace supports Ubuntu and MacOS, so both are
  # checked.
  pinned-linux:
    name: hol-light (pinned), Linux
    uses: ./.github/workflows/build-and-test.yml
    with:
      runs-on: 'ubuntu-24.04'

  pinned-macos:
    name: hol-light (pinned), MacOS
    uses: ./.github/workflows/build-and-test.yml
    with:
      # Unpinned, unlike the Ubuntu runner: MacOS images are retired much
      # faster, so pinning one only creates maintenance.
      runs-on: 'macos-latest'
