name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # check PRs
  pull_request:
    branches:
      - main

  # check pushes
  push:
    branches:
      - main
    tags:
      - 'ocaml-*/v*'

  # Every Monday at 06:00 UTC, to notice HOL Light master drifting away from us.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # The blocking check. HOL Light is pinned so that a red build always means a
  # change in this repository broke something, rather than upstream moving.
  pinned:
    name: hol-light (pinned)
    uses: ./.github/workflows/build-and-test.yml
    with:
      # Bump this whenever TacticTrace is updated for a newer HOL Light.
      # efebbdc = "Fix broken links and update versions (#201)", 15 Sep 2026.
      hol-light-ref: 'efebbdc3e11792098db9b99b16b75bcdbad8dfeb'

  # Early warning only. HOL Light master moves independently of this repository,
  # and TacticTrace depends on HOL Light internals, so this is checked on a
  # schedule and on demand instead of blocking every pull request.
  master:
    name: hol-light (master)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-and-test.yml
    with:
      hol-light-ref: 'master'
