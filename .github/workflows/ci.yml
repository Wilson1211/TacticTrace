name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # check PRs
  pull_request:
    branches:
      - main

  # check pushes
  push:
    branches:
      - main
    tags:
      - 'ocaml-*/v*'

  # Every Monday at 06:00 UTC, to notice HOL Light master drifting away from us.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # The blocking checks. HOL Light is pinned so that a red build always means a
  # change in this repository broke something, rather than upstream moving.
  # TacticTrace supports Ubuntu and MacOS, so both are checked.
  #
  # The pinned revision is repeated in both jobs below and has to be bumped in
  # both: a reusable workflow's 'with:' cannot read the 'env' context, so there
  # is nowhere to put it just once.
  # efebbdc = "Fix broken links and update versions (#201)", 15 Sep 2026.
  pinned-linux:
    name: hol-light (pinned), Linux
    uses: ./.github/workflows/build-and-test.yml
    with:
      runs-on: 'ubuntu-24.04'
      hol-light-ref: 'efebbdc3e11792098db9b99b16b75bcdbad8dfeb'

  pinned-macos:
    name: hol-light (pinned), MacOS
    uses: ./.github/workflows/build-and-test.yml
    with:
      # Unpinned, unlike the Ubuntu runner: MacOS images are retired much
      # faster, so pinning one only creates maintenance.
      runs-on: 'macos-latest'
      hol-light-ref: 'efebbdc3e11792098db9b99b16b75bcdbad8dfeb'

  # Early warning only. HOL Light master moves independently of this repository,
  # and TacticTrace depends on HOL Light internals, so these are checked on a
  # schedule and on demand instead of blocking every pull request.
  master-linux:
    name: hol-light (master), Linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-and-test.yml
    with:
      runs-on: 'ubuntu-24.04'
      hol-light-ref: 'master'

  master-macos:
    name: hol-light (master), MacOS
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-and-test.yml
    with:
      runs-on: 'macos-latest'
      hol-light-ref: 'master'
